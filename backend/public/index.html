<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaundryFlow</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            🧺 LaundryFlow
        </div>

        <div class="top-actions">
            <button id="notification-btn" class="icon-btn" type="button" aria-label="Notifications">
                <span class="icon">🔔</span>
                <span id="notification-count" class="notification-dot">0</span>
            </button>
            <button class="avatar-btn" type="button" aria-label="User account">
                TU
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="container">

        <!-- Header -->
        <section class="page-header">
            <div>
                <h1>Laundry Machines</h1>
                <p>Monitor machine availability in real time.</p>
            </div>

            <div class="live-badge">
                ● Live · refreshes every 10s
            </div>
        </section>

        <!-- Stats -->
        <section class="stats-grid">
            <div class="stat-card">
                <span>Available</span>
                <h2 id="available-count">0</h2>
            </div>

            <div class="stat-card">
                <span>In Use</span>
                <h2 id="inuse-count">0</h2>
            </div>

            <div class="stat-card">
                <span>Maintenance</span>
                <h2 id="maintenance-count">0</h2>
            </div>

            <div class="stat-card">
                <span>Total</span>
                <h2 id="total-count">0</h2>
            </div>
        </section>

        <!-- Machines -->
        <section>
            <div class="section-title">
                <h2>All Machines</h2>
            </div>

            <div id="machines-loading" class="loading-state">Loading machines...</div>
            <div id="machines-grid" class="machines-grid"></div>
        </section>

        <!-- Issues -->
        <section class="issues-section">
            <div class="section-title">
                <h2>Maintenance Issues</h2>
            </div>

            <div id="issues-loading" class="loading-state">Loading issues...</div>
            <table>
                <thead>
                    <tr>
                        <th>Machine</th>
                        <th>Issue</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="issues-table"></tbody>
            </table>
        </section>

    </main>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div id="issue-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="issue-modal-title">
            <h3 id="issue-modal-title">Report an Issue</h3>
            <p id="issue-machine-label" class="modal-subtitle"></p>
            <label for="issue-description" class="field-label">Describe the issue</label>
            <textarea id="issue-description" rows="4" placeholder="Example: Machine not spinning"></textarea>
            <div class="modal-actions">
                <button id="cancel-issue-btn" class="report-btn" type="button">Cancel</button>
                <button id="submit-issue-btn" class="start-btn" type="button">Submit Report</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
